<div style="font-family:Arial,sans-serif;max-width:520px;margin:auto;padding:24px;color:#294435">
  <h2>Confirm your Stress Unwind account</h2>
  <p>Enter this one-time code on the Stress Unwind sign-up page to confirm your email:</p>
  <p style="font-size:28px;letter-spacing:5px;font-weight:bold">{{ .Token }}</p>

  <p>Stress Unwind</p>
