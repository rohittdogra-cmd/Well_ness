<h2>Welcome to your wellness community</h2>
<p>Confirm your email to create your profile and connect with other members.</p>
<p>
  <a
    href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=signup"
    >Confirm and continue</a
  >
</p>
<p>Or return to the sign-in page and enter this one-time code:</p>
<p><strong>{{ .Token }}</strong></p>
<p>
  Use only the most recent email. If you did not request this, you can ignore
  it.
</p>
