<div
  style="
    font-family: Arial, sans-serif;
    max-width: 520px;
    margin: auto;
    padding: 32px;
    color: #294435;
    background: #fcfcf8;
  "
>
  <h2>Let’s get you back to Wellness.</h2>
  <p>
    You requested a password reset. Open this secure link to choose a new
    password:
  </p>
  <p>
    <a
      style="
        display: inline-block;
        background: #426447;
        color: white;
        padding: 14px 22px;
        border-radius: 10px;
        text-decoration: none;
      "
      href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=recovery&amp;next=/account"
      >Reset my password</a
    >
  </p>
  <p>
    This link can be used once. If you did not request it, ignore this email.
    Your password stays unchanged.
  </p>
</div>
